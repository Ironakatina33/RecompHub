<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b2359"><title>RecompHub v4</title>
<link rel="icon" href="/assets/icon.svg"><link rel="stylesheet" href="/assets/style.css">
<script>window.RECOMPHUB_TOKEN=__BOOT_TOKEN__;</script><script src="/assets/app.js" defer></script>
</head>
<body data-theme="ps3">
<div id="windowbar" class="windowbar" hidden>
  <div id="windowdrag" class="windowdrag" title="Déplacer RecompHub"><span class="drag-dot"></span><span class="drag-title">RecompHub</span></div>
  <div class="win-controls">
    <button data-win="minimize" title="Réduire" aria-label="Réduire"><svg viewBox="0 0 16 16"><path d="M3 12h10"/></svg></button>
    <button data-win="maximize" title="Agrandir / restaurer" aria-label="Agrandir / restaurer"><svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9"/></svg></button>
    <button class="close" data-win="close" title="Fermer" aria-label="Fermer"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>
</div>
<div id="surface" class="surface"><main id="screen" class="screen" tabindex="-1"></main></div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
